<header>
  <app-nav></app-nav>
</header>

<main class="container-fluid">
  <div class="row">
    <div class="col-lg-10 offset-lg-1">
      <h3 class="text-white mb-3">BIDS CONFIGURATION</h3>

      <div class="card text-white bg-dark border border-light">
        <div class="card-body">
          <h5 class="pb-3">WESM</h5>

          <div class="form-group">
            <label>URL</label>
            <input type="text" class="form-control bg-dark text-white" placeholder="URL">
          </div>

          <div class="form-group">
            <label>Operation</label>
            <input type="text" class="form-control bg-dark text-white" placeholder="Operation">
          </div>

          <div class="form-group">
            <label>Certificate</label>
            <input type="file" class="form-control-file bg-dark text-white">

          <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control bg-dark text-white" placeholder="Password">

          <div class="form-group">
            <label>Friendly Name</label>
            <input type="text" class="form-control bg-dark text-white" placeholder="Friendly Name">
          </div>

          <div class="form-group">
            <label>TP Name</label>

          <div class="form-group">
            <label>Bid Type</label>
            <select class="form-control bg-dark text-white">
              <option selected disabled>Select Type</option>
            </select>
          </div>

          <h5 class="pt-3 pb-3">DIRECTORIES</h5>

          <div class="form-group">
            <label>Excel File</label>
            <input type="file" class="form-control-file">
          </div>

          <div class="form-group">
            <label>PI Interface</label>
            <input type="file" class="form-control-file">
          </div>
        </div>

        <div class="card-footer border-light text-right">
          <button class="btn btn-warning">Save</button>
        </div>
      </div>
    </div>
