<header>
  <app-nav></app-nav>
</header>

<main class="container-fluid mt-5">
  <div class="row">
    <div class="col-lg-10 offset-lg-1">
      <div class="card">
        <div class="card-header maindivheader">
          <div class="row">
            <div class="col-sm-6">
              <h5>Web Service List</h5>
            </div>
            <div class="col-sm-6">

            </div>
          </div>
        </div>
        <div class="card-body">
          <ngb-alert *ngIf="successMessage" type="success" (close)="successMessage = null">{{ successMessage }}</ngb-alert>
          <div class="table-responsive">
            <table class="table table-bordered">
              <thead>
                <tr>
                  <th>URL</th>
                  <th>Type</th>
                  <th class="text-center">Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let list of lists; let i = index">
                  <td>{{ list.URL }}</td>
                  <td>{{ list.Type }}</td>
                  <td class="w-10 text-center">
                    <button class="btn btn-xs font-sm btn-outline-warning" (click)="openModal(updateListModal, list)">
                      Update
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<ng-template #updateListModal let-modal>
  <div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">Update Web Service</h4>
    <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <div class="form-group">
      <label>URL</label>
      <input type="text" class="form-control" #url placeholder="https://" value="{{ selectedList?.URL }}">
    </div>

    <div class="form-group">
      <select class="form-control" #type>
        <option value="Upload" [selected]="selectedList?.Type === 'Upload'">Upload</option>
        <option value="Download" [selected]="selectedList?.Type === 'Download'">Download</option>
      </select>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-dark" (click)="updateWebService(selectedList.WebID, url.value, type.value)">Save</button>
  </div>
</ng-template>
